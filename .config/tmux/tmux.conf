# ~/.config/tmux/tmux.conf

### general ###
set -g xterm-keys on

### keybindings ###
bind q detach-client  # quit (detach) the current session
bind e choose-window -Z   # interactive window list

# windows split
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v
# windows navigation
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
# window select motions
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R
# window resize
bind -r W resize-pane -U
bind -r A resize-pane -L
bind -r S resize-pane -D
bind -r D resize-pane -R

### prefix key ###
unbind C-b
set -g prefix ì
bind ì send-prefix

### windows buttons ###
set -g window-status-bell-style "bg=red,nobold"
set -g window-status-current-style "bg=white,italics,nobold"

### status bar ###
set -g status on
set -g status-interval 1 # refresh every 1s
set -g status-left ""
#set -g status-right "#S"
set -g status-right "#[fg=white,bg=blue]#H | #S | %Y-%m-%d %H:%M"


### aesthetic ###
set -sg terminal-overrides ",*:RGB"  # true color support
set -g pane-border-lines heavy # thicker border
set -g pane-border-style "fg=white,bg=default" # border color
set -g pane-active-border-style "fg=colour208,bg=default" # border color

### QoL ###
set -g escape-time 0  # disable delays on escape sequences
set -g repeat-time 1000 # 1s window to send tmux commands after prefix
set -g history-limit 10000 # higher history limit
set -g mouse off # enable scrolling window with trackpad/mouse

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

